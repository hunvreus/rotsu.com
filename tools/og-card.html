<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "JetBrains Mono";
        src: url("../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2") format("woff2");
        font-style: normal;
        font-weight: 100 800;
      }

      * { box-sizing: border-box; }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
        background: #141512;
      }

      body {
        padding: 151px 112px;
        color: #f1f1e8;
        font-family: "JetBrains Mono", monospace;
      }

      .mark {
        display: grid;
        width: 58px;
        height: 58px;
        place-items: center;
        background: #e5ff52;
      }

      .mark img {
        width: 42px;
        height: 42px;
      }

      h1 {
        margin: 60px 0 0;
        font-size: 66px;
        font-weight: 500;
        line-height: 1.25;
        letter-spacing: -3.3px;
        text-transform: uppercase;
      }

      h1 span { display: block; }
    </style>
  </head>
  <body>
    <div class="mark"><img src="../public/rotsu-r.svg" alt="" /></div>
    <h1><span>We create tools</span><span>for builders</span></h1>
  </body>
</html>
